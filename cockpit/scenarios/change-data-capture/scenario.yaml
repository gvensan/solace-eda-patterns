id: change-data-capture
# Category 1 of the pattern guide (Event Generation Patterns), third pattern.
order: 130
eyebrow: Event Generation Patterns
title: Change Data Capture
summary: >
  A warehouse's inventory app is old, and nobody wants to change it. It
  writes stock changes to its own database and knows nothing about events.
  A change data capture connector reads the database's log of committed
  changes and publishes an event for each one, and the search index keeps
  its stock figures from those events. The inventory app is not touched.

objectives:
  - See every database change become an event, with no change to the app that wrote it
  - See the connector resume from its saved position after a crash, with nothing missed
  - See a connector that lost its position publish old changes again, and the consumer ignore them
  - Learn why change data capture delivers at least once

pattern:
  what: >
    Turn the committed changes in a database into events, without changing
    the application that writes to it. The usual form, log-based, reads the
    database's own change log.
  when: >
    A system of record cannot or should not be modified, but other systems
    need to react to its changes.
  cost: >
    Events mirror tables, not business intent. Delivery is at least once,
    and a database keeps its log only so long: a connector down too long has
    to start again from a snapshot.
  solace: >
    A connector publishes each change as a guaranteed event on a topic per
    table or key, and each consumer reads its own queue. Solace
    Micro-Integrations include change data capture for Oracle, MySQL,
    Microsoft SQL Server and IBM Db2.
  related: [event-carried-state-transfer, data-synchronization, strangler]
  guide: https://solace.com/event-driven-architecture-patterns/#cdc

run:
  - apply
  - build
  - search
  - connector
  - inventory

cleanup:
  - destroy
  - forget-database

diagram:
  caption: >
    A warehouse. The inventory app writes each sale and restock to its
    database and nothing else: it has no line, because it never talks to
    the broker. The connector reads the database's change log in order and
    publishes each change as a guaranteed event on
    cdc/inventory/stock/changed/v1/<sku>. q.cdc.search keeps them for the
    search index. Two assumptions: a file stands in for the database's
    change log, and the search index is for browsing only. The warehouse's
    database stays the authority for any stock decision.
  holdsCaption: >
    The search index is built from events the inventory app never
    published. Compare the Inventory App's database with the Search Index:
    the same stock for every SKU, set by the same change, a moment apart.
    The connector's card says how far through the database's change log it
    has published. That is change data capture. Without it, the inventory
    app's code would have to change to publish anything.
  duration: 2.4
  liveWhen: connector
  nodes:
    - id: inventory
      label: Inventory App
      sublabel: writes its database
      kind: app
      col: 0
      action: inventory
      holds:
        kept: disk
        count: SKUs
        role: The system of record. Writes every change to its database, and publishes nothing.
    - id: connector
      label: CDC Connector
      sublabel: reads the change log
      kind: app
      col: 0
      action: connector
      holds:
        kept: disk
        counters: true
        role: Reads the change log in order, and saves how far it got once the broker accepts each change.
      requires:
        - label: svc-cdc-connector
          semp: /msgVpns/{vpn}/clientUsernames/svc-cdc-connector
    - id: broker
      label: Solace Broker
      sublabel: one event per change
      kind: broker
      col: 1
      action: apply
      contains:
        - id: search
          label: q.cdc.search
          depth: { queue: q.cdc.search, unit: waiting }
      provides:
        - label: q.cdc.search
          group: search
          semp: /msgVpns/{vpn}/queues/q.cdc.search
        - label: cp-cdc
          semp: /msgVpns/{vpn}/clientProfiles/cp-cdc
        - label: acl-cdc
          semp: /msgVpns/{vpn}/aclProfiles/acl-cdc
    - id: searchapp
      label: Search Index
      sublabel: stock per SKU
      kind: app
      col: 2
      action: search
      holds:
        kept: memory
        count: SKUs
        copyOf: inventory
        role: Built only from the change events. Ignores a change it has already applied.
      flowOn:
        queue: q.cdc.search
        client: cdc-search
      requires:
        - label: svc-cdc-search
          semp: /msgVpns/{vpn}/clientUsernames/svc-cdc-search
  flows:
    - { id: publish, from: connector, to: broker, via: search, label: stock changed, labelAt: 0.5, delay: 0 }
    - { id: deliver, from: broker, to: searchapp, via: search, delay: 0.8 }
  paths:
    - label: A stock change in the database becomes an event
      steps:
        - flow: publish
          text: The inventory app commits a change to its database. The connector reads it from the change log and publishes it; q.cdc.search keeps it.
        - flow: deliver
          text: The search index applies the change, unless it has applied it already, and acknowledges it.

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates q.cdc.search, and the client profile, ACL profile and
      usernames for the connector and the search index. The inventory app
      needs none.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: search
    label: Start the search index
    kind: process
    cmd: [bash, ../../apps/run.sh, cdc, search, --client-name, cdc-search]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Reads q.cdc.search and keeps the stock per SKU. It applies a change
      only if it is newer than the last one it applied for that SKU.

  - id: connector
    label: Start the CDC connector
    kind: process
    cmd: [bash, ../../apps/run.sh, cdc, connector, --client-name, cdc-connector]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Reads the inventory database's change log from its saved position,
      publishes each change, and saves the position once the broker has
      accepted it.

  - id: connector-from-start
    label: Start the CDC connector with no saved position
    kind: process
    cmd: [bash, ../../apps/run.sh, cdc, connector, --client-name, cdc-connector, --from-start]
    cwd: .
    long_running: true
    stands_for: connector
    variant: secondary
    failure_only: true
    description: >
      The same connector, ignoring its saved position as if it had lost it:
      it reads the change log from the first change. Stop the connector
      first.

  - id: inventory
    label: Start the inventory app
    kind: process
    cmd: [bash, ../../apps/run.sh, cdc, inventory]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Sells or restocks something every second and writes each change to its
      database. It does not connect to the broker.

  - id: kill-connector
    label: Crash the CDC connector
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, cdc-connector, KILL, --wait-exit]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills the connector outright (SIGKILL), and returns once it has gone.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, change-data-capture]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: forget-database
    label: Delete the inventory database
    kind: process
    cmd: [bash, ../../apps/run.sh, cdc, inventory, --forget]
    cwd: .
    variant: danger
    description: >
      Deletes the inventory database and the connector's saved position, so
      the next Play starts with a new database.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the queue and access control for this scenario.

failure_modes:
  - id: connector-crash
    title: The connector crashes
    breaks: >
      The CDC connector is killed. The inventory app keeps writing.
    watch:
      normally: >
        The connector publishes each change a moment after the inventory app
        commits it. Under the diagram, the Search Index matches the
        Inventory App's database, 6 of 6 SKUs.
      broke: >
        The connector's output ends with "exited with code -9". The inventory
        app carries on, "change #N written to the database", and knows
        nothing. Under the diagram the connector's card says it is not
        running, and its saved position stays on disk.
      impact: >
        No new events. The database keeps changing, so the Search Index
        falls out of step with it: the match line shows SKUs that are
        different. Nothing is lost yet: the changes wait in the database's
        change log. The hidden risk: a real database keeps that log only so
        long, and a connector down past that has to start again from a
        snapshot.
      recover: >
        Press Reset. The connector says "saved position found: resuming
        after change #N", publishes every change written while it was down,
        in order, and the Search Index matches the database again. No gap:
        the position is saved after each change the broker accepts. A change
        in flight at the crash may be published again; the search index
        ignores it.
    why: >
      The database keeps its change log whether or not anyone reads it. The
      connector saves how far it has got after the broker accepts each
      change, so after a crash it carries on from there. The source
      application is not involved at any point, which is why change data
      capture suits systems nobody wants to modify.
    real_world: >
      Debezium and similar tools reading the PostgreSQL write-ahead log or
      the MySQL binlog. The database keeps its log for a limited time, so a
      connector down for too long can find the changes it needs already
      gone, and has to start again from a full snapshot.
    docs:
      - label: "Go API: publishing guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Publish.htm
      - label: "Guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: connector
    logs: connector
    trigger:
      - run: kill-connector
    reset:
      - start: connector
    expect:
      break:
        within: 15
        logs:
          - log: connector
            has: ["exited with code -9"]
          - log: inventory
            has: ["change #\\d+ written to the database"]
      reset:
        within: 15
        logs:
          - log: connector
            has: ["saved position found: resuming after change #\\d+", "change #\\d+ published"]
          - log: search
            has: ["SKU-\\d+ shows \\d+ in stock"]
        holds:
          - { node: searchapp, min: 6, matched: { min: 5 } }

  - id: connector-lost-position
    title: The connector loses its saved position
    breaks: >
      The connector restarts without its saved position and reads the
      change log from the first change.
    watch:
      normally: >
        Each change is published once, and the Search Index matches the
        Inventory App's database.
      broke: >
        The connector says "no saved position: reading the change log from
        the first change" and publishes every change again, all within about
        a second. Scroll up in the search index output to that burst of
        "change #12 for SKU-03 again: already applied, ignored"; after it,
        new changes apply as normal. Its card under the diagram keeps the
        count of repeats it ignored.
      impact: >
        The stock figures do not move backwards: the index compares each
        change's number with the last one it applied for that SKU, so it
        still matches the database. The hidden risk is in consumers that do
        not check: one that adds to a counter or sends an email for each
        event does it twice.
      recover: >
        Press Reset. The normal connector starts, says "saved position
        found: resuming after change #N" (the position the other one saved),
        and carries on from there. Nothing was lost; every repeat was
        ignored.
    why: >
      A connector saves its position after publishing, so after a crash at
      the wrong moment, or a lost position, it publishes some changes again.
      Change data capture is at least once. Each change carries the
      database's own sequence number, which is what lets a consumer tell a
      repeat from a new change.
    real_world: >
      A connector redeployed with its offsets reset, or restored from an
      old backup, sends hours of changes again. (A real connector that has
      lost its offsets usually starts with a fresh snapshot of the tables,
      because the database's log no longer reaches back to the start.) Consumers that apply a
      change blindly (add 1 to a counter, send an email) do it twice.
    docs:
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: searchapp
    logs: search
    trigger:
      - stop: connector
      - start: connector-from-start
    reset:
      - stop: connector-from-start
      - start: connector
    expect:
      break:
        within: 15
        logs:
          - log: connector-from-start
            has: ["no saved position: reading the change log from the first change"]
          - log: search
            has: ["change #\\d+ for SKU-\\d+ again: already applied, ignored"]
        holds:
          - { node: searchapp, min: 6, missing: { max: 0 } }
      reset:
        within: 15
        logs:
          - log: connector
            has: ["saved position found: resuming after change #\\d+"]

inspect:
  - label: Queue
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=20&where=queueName==q.cdc.*
    columns: [queueName, msgSpoolUsage, spooledMsgCount]
    ui_hint: Manager → Queues
    empty: No queue yet. Press Play.
  - label: Connected clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=20&where=clientName==cdc-*
    # Only the connector and the search index: the inventory app never connects.
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
    empty: No app of this scenario is connected. Press Play.
