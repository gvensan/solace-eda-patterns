id: partitioning
# Category 4 of the pattern guide (Consumer Scalability Patterns), fourth pattern.
order: 440
eyebrow: Consumer Scalability Patterns
title: Partitioning
summary: >
  Each order moves through created, paid, packed, shipped and delivered, and
  fulfilment must see one order's updates in that order. Many orders are in
  flight at once, so three consumers share the work. The order id travels
  as the partition key: every update for one order goes to the same
  partition, and a partition has one consumer at a time, so one order's
  updates are handled in order while different orders are handled in
  parallel. Which consumer owns a partition can change when consumers join
  or leave, and several orders share each partition.

objectives:
  - See every update for one order go through one partition to one consumer, in order
  - See the broker share six partitions between the consumers, two each
  - Crash a consumer, and add a fourth, and watch partitions move
  - Publish without a partition key and see one order's updates split between consumers

pattern:
  what: >
    Messages with the same key always go to the same partition, and each
    partition is read by one consumer at a time, in order, while different
    keys spread across partitions and consumers.
  when: >
    Order matters for each entity (an order, an account, a device) but not
    across them, and one consumer is not enough.
  cost: >
    A busy key loads one consumer, partitions move when consumers join or
    leave, and consumers beyond the partition count sit idle.
  solace: >
    A partitioned queue: the broker hashes each message's partition key to a
    partition, and gives each partition to one consumer.
  related: [exclusive-consumer, consumer-groups, competing-consumers]
  guide: https://solace.com/event-driven-architecture-patterns/#partitioning

run:
  - apply
  - build
  - fulfilment-1
  - fulfilment-2
  - fulfilment-3
  - orders

cleanup:
  - destroy

# How hard the order service works. Clear is easiest to follow: one order
# per partition, so each lane carries one colour at a time. Busy shows the
# usual case, several keys sharing a partition. Shown on the Order Service.
settings:
  pace:
    label: Pace
    node: orders
    default: clear
    choices:
      - value: clear
        label: Clear
        sublabel: "clear: 6 orders, 2/s"
        description: >
          Six orders in flight, one in each partition, two updates a second.
          Each lane carries one colour at a time, so one order is easy to
          follow from the order service to its consumer.
        args: [--in-flight, "6", --rate, "2"]
      - value: busy
        label: Busy
        sublabel: "busy: 10 orders, 5/s"
        description: >
          Ten orders in flight, five updates a second. Closer to real
          traffic: several keys share most partitions, unevenly, and every
          consumer stays busy. Ten is as many colours as stay easy to tell
          apart.
        args: [--in-flight, "10", --rate, "5"]

# Checked by smoke.py once Play has finished, before any Break it card.
expect:
  play:
    within: 20
    partitions:
      orders: one-consumer
      owned: all
      owns:
        - { node: fulfil1, min: 2, max: 2 }
        - { node: fulfil2, min: 2, max: 2 }
        - { node: fulfil3, min: 2, max: 2 }

diagram:
  caption: >
    The order service publishes each update with the order id as its
    partition key. The queue has six partitions, drawn as lanes; the key
    picks the lane, and each lane belongs to one consumer. Each dot is one
    update a consumer has handled, coloured and lettered by its order, drawn
    through the partition the broker held it in.
  duration: 2.4
  liveWhen: orders
  # Each line a consumer prints for an update it handled. The dashboard
  # reads the order, its sequence number, its key and the broker's number
  # for the message, and places the update in a partition from broker data.
  events:
    pattern: '\] (?P<order>O-\d+) #(?P<seq>\d+) (?P<status>\w+) \((?:key (?P<key>[^,)]+)|no key)(?:, msg (?P<msg>\d+))?\)'
    flags:
      gap: 'GAP: '
      order: 'OUT OF ORDER: '
      picked: 'picked up '
      redelivered: '\(redelivered\)'
  nodes:
    - id: orders
      label: Order Service
      sublabel: keyed by order id
      kind: app
      col: 0
      action: orders
      requires:
        - label: svc-part-orders
          semp: /msgVpns/{vpn}/clientUsernames/svc-part-orders
    - id: broker
      label: Solace Broker
      sublabel: one key, one partition
      kind: broker
      col: 1
      action: apply
      contains:
        - id: partitioned
          label: q.part.orders
          partitions:
            queue: q.part.orders
            count: 6
      provides:
        - label: q.part.orders
          group: partitioned
          semp: /msgVpns/{vpn}/queues/q.part.orders
        - label: cp-part
          semp: /msgVpns/{vpn}/clientProfiles/cp-part
        - label: acl-part
          semp: /msgVpns/{vpn}/aclProfiles/acl-part
    - id: fulfil1
      label: Fulfilment 1
      sublabel: its own orders
      kind: app
      col: 2
      action: fulfilment-1
      flowOn:
        queue: q.part.orders
        client: part-fulfilment-1
      requires:
        - label: svc-part-fulfilment
          semp: /msgVpns/{vpn}/clientUsernames/svc-part-fulfilment
    - id: fulfil2
      label: Fulfilment 2
      sublabel: its own orders
      kind: app
      col: 2
      action: fulfilment-2
      flowOn:
        queue: q.part.orders
        client: part-fulfilment-2
      requires:
        - label: svc-part-fulfilment
          semp: /msgVpns/{vpn}/clientUsernames/svc-part-fulfilment
    - id: fulfil3
      label: Fulfilment 3
      sublabel: its own orders
      kind: app
      col: 2
      action: fulfilment-3
      flowOn:
        queue: q.part.orders
        client: part-fulfilment-3
      requires:
        - label: svc-part-fulfilment
          semp: /msgVpns/{vpn}/clientUsernames/svc-part-fulfilment
    - id: fulfil4
      label: Fulfilment 4
      sublabel: started by Break it
      kind: app
      col: 2
      action: fulfilment-4
      flowOn:
        queue: q.part.orders
        client: part-fulfilment-4
      requires:
        - label: svc-part-fulfilment
          semp: /msgVpns/{vpn}/clientUsernames/svc-part-fulfilment
  flows:
    - { from: orders, to: broker, label: order updates, delay: 0 }
    - { from: broker, to: fulfil1, via: partitioned, delay: 0.8 }
    - { from: broker, to: fulfil2, via: partitioned, delay: 1.0 }
    - { from: broker, to: fulfil3, via: partitioned, delay: 1.2 }
    - { from: broker, to: fulfil4, via: partitioned, delay: 1.4 }

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the partitioned queue q.part.orders (six partitions), its
      topic subscription, and the client profile, ACL profile and usernames
      for this scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: fulfilment-1
    label: Start fulfilment 1
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, fulfil, --role, fulfilment-1, --client-name, part-fulfilment-1]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Binds the partitioned queue and handles order updates, checking that
      each order's sequence numbers arrive one at a time.

  - id: fulfilment-2
    label: Start fulfilment 2
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, fulfil, --role, fulfilment-2, --client-name, part-fulfilment-2]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The same consumer again. The broker gives it partitions of its own, so
      it handles different orders.

  - id: fulfilment-3
    label: Start fulfilment 3
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, fulfil, --role, fulfilment-3, --client-name, part-fulfilment-3]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      A third copy. Six partitions over three consumers: two each.

  - id: fulfilment-4
    label: Start fulfilment 4
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, fulfil, --role, fulfilment-4, --client-name, part-fulfilment-4]
    cwd: .
    long_running: true
    variant: secondary
    failure_only: true
    description: >
      A fourth copy, which Play does not start. The broker takes a partition
      from one of the others and gives it to this one.

  - id: orders
    label: Publish order updates
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, orders, "{setting:pace}"]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Publishes status updates for several orders at a time, each with its
      order id as the partition key and a sequence number, #1 to #5. How
      many, and how fast, is the Pace setting on the Order Service: six
      orders at two a second (Clear), or ten at five (Busy).

  - id: orders-no-key
    label: Publish without a key
    kind: process
    cmd: [bash, ../../apps/run.sh, partition, orders, --no-key, "{setting:pace}"]
    cwd: .
    long_running: true
    stands_for: orders
    variant: secondary
    failure_only: true
    description: >
      The same order service, but publishing every update without a
      partition key.

  - id: kill-consumer
    label: Crash a consumer
    kind: process
    cmd: [bash, ../../scripts/signal_consumer.sh, q.part.orders, active, KILL]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills one fulfilment consumer outright: the active one with the lowest
      client name, which the page marks.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, partitioning]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the queue and the access control for this scenario. Any update
      still on the queue goes with it.

failure_modes:
  - id: consumer-crashes
    title: A consumer crashes, and its partitions move
    breaks: >
      One fulfilment consumer is killed while it handles its orders.
    watch: >
      In the diagram, the crashed consumer's two lanes lose their owner and
      say "no owner". For 5 seconds nothing reads them, so their held counts
      creep up. Then the broker gives one lane to each of the other
      consumers, and the lane lines swing over. The card shows one of them:
      it usually starts receiving an order it has never seen, part way
      through its life, "picked up O-... at #3". Sometimes the moved lane
      happens to start a new order instead, at #1. Every order still moves one number
      at a time: no GAP and no OUT OF ORDER. Reset starts the crashed consumer
      again, and after 5 seconds two lanes move back to it.
    why: >
      Each partition belongs to one consumer at a time. When a consumer
      goes, the broker waits the rebalance delay (5 seconds here), then
      gives its partitions to the consumers that are left, keeping their
      counts within one of each other. Updates it had taken but not
      acknowledged are delivered again first, in their original order, so
      each order stays in sequence across the move.
    real_world: >
      A consumer crashes, or is scaled down or redeployed. Partitioning
      keeps per-key order through that, at the cost of a pause for the
      moved keys while the broker waits and rebalances.
    docs:
      - label: "Go API: publishing persistent messages (partition keys)"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Publish.htm
      - label: "Broker: partition rebalancing"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partition-Rebalancing.htm
      - label: "Broker: partition handoff"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partition-Handoff.htm
    node: {role: active}
    logs: {role: other}
    trigger:
      - run: kill-consumer
    reset:
      - start: fulfilment-1
      - start: fulfilment-2
      - start: fulfilment-3
    expect:
      break:
        within: 25
        logs:
          - log: {role: active}
            has: ["exited with code -9"]
          - log: {role: other}
            has: ["#\\d \\w+ \\(key O-"]
            lacks: ["GAP", "OUT OF ORDER"]
        partitions:
          moved: true
          owned: all
          owns:
            - { node: {role: active}, max: 0 }
      reset:
        within: 25
        logs:
          - log: {role: active}
            has: ["#\\d \\w+ \\(key O-"]
            lacks: ["GAP", "OUT OF ORDER"]
        partitions:
          moved: true
          owned: all
          owns:
            - { node: {role: active}, min: 2, max: 2 }

  - id: fourth-consumer
    title: A fourth consumer joins
    breaks: >
      Fulfilment 4 starts and binds the same queue, while the other three
      are busy.
    watch: >
      Fulfilment 4 binds at once, but for 5 seconds it owns nothing. Then
      the broker takes one lane from one of the other consumers and gives
      it to Fulfilment 4: the lane line swings over, and the counts on the
      consumers read two, two, one and one. Six partitions do not share out
      evenly over four. The card shows Fulfilment 4's log: it usually picks
      orders up part way, "picked up O-... at #2", and they still move one
      number at a time. Reset stops it, and 5 seconds later its lane goes
      back.
    why: >
      A consumer joining a queue that has fewer consumers than partitions
      starts a rebalance, after the same delay. The broker moves as few
      partitions as it can: one here, from a consumer that had two. The old
      owner is given time to acknowledge what it holds (the handoff), so
      the order's next update reaches the new owner in sequence.
    real_world: >
      Scaling out a consumer group. It only helps up to the partition
      count: a seventh consumer here would own nothing and sit idle. Pick a
      partition count with room to grow, and changing it later moves keys.
    docs:
      - label: "Go API: consuming persistent messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: partition rebalancing"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partition-Rebalancing.htm
      - label: "Broker: partition handoff"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partition-Handoff.htm
    node: fulfil4
    logs: fulfilment-4
    trigger:
      - start: fulfilment-4
    reset:
      - stop: fulfilment-4
    expect:
      break:
        within: 25
        logs:
          - log: fulfilment-4
            has: ["#\\d \\w+ \\(key O-"]
            lacks: ["GAP", "OUT OF ORDER"]
        partitions:
          moved: true
          owned: all
          owns:
            - { node: fulfil4, min: 1, max: 1 }
      reset:
        within: 20
        logs:
          - log: fulfilment-4
            has: ["stopped after \\d+ update"]
        partitions:
          moved: true
          owned: all
          owns:
            - { node: fulfil4, max: 0 }

  - id: no-key
    title: The publisher forgets the partition key
    breaks: >
      The order service restarts without setting the partition key on its
      updates.
    watch: >
      In the diagram, one order's dots (the same letter and colour) now go
      down different lanes to different consumers. The consumers print
      GAP: one order's updates arrive at more than one of them, so each
      sees numbers missing, for example "O-... #1 then #3 (#2 went to
      another consumer)", and the consumer card flags it. The log lines say
      "no key". Reset restarts the order service with the key and the GAP
      lines stop.
    why: >
      The partition key is what ties an order to one partition. Without
      one, the broker places each message itself (here, it went round the
      partitions in turn), so successive updates for the same order land
      on different partitions, and so on different consumers, which handle
      them in parallel, in no particular order.
    real_world: >
      A new publisher, a library upgrade or a refactor that drops the key
      property. Nothing fails: messages still flow and every consumer stays
      busy, so the first sign is out-of-order processing downstream. Make
      the key part of the message contract, and check for it.
    docs:
      - label: "Go API: publishing persistent messages (partition keys)"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Publish.htm
      - label: "Broker: message distribution with partitioned queues"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Partitioned-Queue-Messaging.htm
    node: orders
    logs: {role: active}
    trigger:
      - stop: orders
      - start: orders-no-key
    reset:
      - stop: orders-no-key
      - start: orders
    expect:
      break:
        within: 30
        logs:
          - log: {role: active}
            has: ["GAP: ", "no key"]
        partitions:
          orders: split
      reset:
        # Updates already on the queue without a key still arrive for a
        # moment after the reset.
        settle: 8
        within: 20
        logs:
          - log: {role: active}
            has: ["\\(key O-"]
            lacks: ["GAP", "OUT OF ORDER"]
        partitions:
          orders: one-consumer

inspect:
  - label: Queue
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=10&where=queueName==q.part.*
    # partitionRebalanceStatus leaves "ready" while partitions are moving.
    columns: [queueName, accessType, partitionCount, partitionRebalanceStatus, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
    empty: The queue is not on the broker. Press Play, or run Apply configuration.
  # The broker keeps each partition as an internal queue of its own, and
  # names the client that owns it.
  - label: Partitions of q.part.orders
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=20&where=partitionQueueName==q.part.orders
    columns: [partitionNumber, partitionClientName, spooledMsgCount, txUnackedMsgCount, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues → q.part.orders → Partitions
    empty: The queue is not on the broker, so it has no partitions yet. Press Play.
  - label: Consumers on q.part.orders
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues/q.part.orders/txFlows?count=10
    columns: [clientName, activityState, ackedMsgCount, unackedMsgCount, redeliveredMsgCount]
    ui_hint: Manager → Queues → q.part.orders → Consumers
    empty: No consumer is bound to q.part.orders right now. Press Play, or start a fulfilment consumer.
