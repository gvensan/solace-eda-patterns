id: event-streaming
# Category 2 of the pattern guide (Communication Patterns), fourth pattern.
order: 240
eyebrow: Communication Patterns
title: Event Streaming
summary: >
  A bike-share. Every ride start and ride end is an event, and the counter
  keeps which bikes are in use: the bike is added on a start and removed on
  an end. That is only right if the counter has seen the stream in order
  from where its state started. A queue keeps the stream in order and holds
  the counter's position in it; a snapshot keeps the state across a crash.
  The city's board lists the rides in progress (which bikes are out, and
  for how long) from the same events, taken direct, with neither. Each
  event also carries the bikes' own total, as a check: it says how many are
  out, never which.

objectives:
  - See a stream of events consumed in order, with the consumer's state built from it
  - See a consumer crash and carry on from its position with its state intact
  - See a consumer that joins the stream late miss the state it needs, and why a total in the event cannot replace it
  - Learn what a queue holds for a stream consumer, and what a snapshot adds

pattern:
  what: >
    Consumers read an unbounded, ordered sequence of events, each with its
    own position in it, building state as they go.
  when: >
    Events form a sequence to be processed in order: telemetry, positions,
    counters, activity.
  cost: >
    A consumer has to keep its position and its state in step, and one that
    joins late has no history unless something replays it.
  solace: >
    Here a queue per consumer stands in for the stream: it keeps the order,
    and acknowledgements are the position. It is not a retained log: an
    acknowledged event is gone, and a new consumer cannot read from the
    start. A replay log can feed history to a consumer that needs it.
  related: [event-sourcing, publish-subscribe, partitioning]
  guide: https://solace.com/event-driven-architecture-patterns/#streaming

run:
  - apply
  - build
  - counter
  - bikes

cleanup:
  - destroy
  - forget-snapshot

diagram:
  caption: >
    The bikes publish each ride start and end, guaranteed and numbered.
    q.es.rides keeps them in order and holds the counter's position: the
    counter applies each event to its count, writes a snapshot, and
    acknowledges. Play does not start the city board: the card "The city
    board joins the stream late" does, and from then on it takes the same
    events direct. The counter can stop and resume, from its queue and its
    snapshot. A consumer that is new to the stream has neither: it needs
    the history replayed, or a snapshot to start from.
  holdsCaption: >
    Two apps build state from the same ride events. The Counter has read
    the stream from where its state started, so its list of bikes in use
    is complete. The City Board lists only the rides it saw start. Once
    the board is running, compare the two tables: every bike on the
    Counter's list that is missing from the board's is a ride the board
    cannot name, and the total in each event says how many, never which.
  duration: 2.4
  liveWhen: bikes
  nodes:
    - id: bikes
      label: Bikes
      sublabel: four ride events a second
      kind: app
      col: 0
      action: bikes
      requires:
        - label: svc-es-bikes
          semp: /msgVpns/{vpn}/clientUsernames/svc-es-bikes
    - id: broker
      label: Solace Broker
      sublabel: keeps the stream in order
      kind: broker
      col: 1
      action: apply
      contains:
        - id: rides
          label: q.es.rides
          depth: { queue: q.es.rides, unit: ahead }
      provides:
        - label: q.es.rides
          group: rides
          semp: /msgVpns/{vpn}/queues/q.es.rides
        - label: cp-es
          semp: /msgVpns/{vpn}/clientProfiles/cp-es
        - label: acl-es
          semp: /msgVpns/{vpn}/aclProfiles/acl-es
    - id: counter
      label: Counter
      sublabel: bikes in use, with a snapshot
      kind: app
      col: 2
      action: counter
      holds:
        kept: memory
        count: bikes
        role: Has read the stream in order from where its state started. A snapshot on disk, written before each acknowledgement, brings this list back after a crash.
      flowOn:
        queue: q.es.rides
        client: es-counter
      requires:
        - label: svc-es-counter
          semp: /msgVpns/{vpn}/clientUsernames/svc-es-counter
    - id: board
      label: City Board
      sublabel: started by Break it
      kind: app
      col: 2
      action: board
      holds:
        kept: memory
        count: rides
        role: Lists each ride from its start event. Started mid-stream, it has no start for the bikes already out.
      requires:
        - label: svc-es-board
          semp: /msgVpns/{vpn}/clientUsernames/svc-es-board
  flows:
    - { from: bikes, to: broker, label: ride started, ride ended, delay: 0 }
    - { from: broker, to: counter, via: rides, delay: 0.8 }
    - { from: broker, to: board, label: direct, delay: 1.0 }

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates q.es.rides, which keeps every ride event in order for the
      counter, and the client profile, ACL profile and usernames for this
      scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: counter
    label: Start the counter
    kind: process
    cmd: [bash, ../../apps/run.sh, es, counter, --client-name, es-counter]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Reads q.es.rides in order, keeps the set of bikes in use, writes it to
      a snapshot before acknowledging each event, and prints the count once
      a second.

  - id: counter-no-snapshot
    label: Start the counter without a snapshot
    kind: process
    cmd: [bash, ../../apps/run.sh, es, counter, --client-name, es-counter, --no-snapshot]
    cwd: .
    long_running: true
    stands_for: counter
    variant: secondary
    description: >
      The same counter, keeping its count in memory only. Stop the counter
      first.

  - id: board
    label: Start the city board
    kind: process
    cmd: [bash, ../../apps/run.sh, es, board, --client-name, es-board]
    cwd: .
    long_running: true
    variant: secondary
    failure_only: true
    description: >
      Lists the rides in progress, which bikes are out and for how long,
      from the events it receives direct, from the moment it starts.

  - id: bikes
    label: Start the bikes
    kind: process
    cmd: [bash, ../../apps/run.sh, es, bikes]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Publishes four ride events a second, guaranteed and numbered, and
      says how many bikes it has out.

  - id: kill-counter
    label: Crash the counter
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, es-counter, KILL, --wait-exit]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills the counter outright (SIGKILL), and returns once it has gone.

  - id: forget-snapshot
    label: Delete the counter's snapshot
    kind: process
    cmd: [bash, ../../apps/run.sh, es, counter, --forget]
    cwd: .
    variant: danger
    description: >
      Deletes the snapshot, so the next Play starts the count from zero.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, event-streaming]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the queue and the access control for this scenario. Any ride
      event still on the queue goes with it.

failure_modes:
  - id: counter-crashes
    title: The counter crashes
    breaks: >
      The counter is killed mid-stream.
    watch: >
      The card shows the counter. Its node goes red, and the count on
      q.es.rides in the diagram starts climbing: the stream goes on, and
      the queue holds the counter's place in it. Press Reset. The counter
      says "restored 23 rides in use from the snapshot", then usually
      "resumed at #812, delivered again after the last stop": the events it
      held unacknowledged come back first, then the rest, in order. (Killed
      between events, with none unacknowledged, it says "resumed at #812".) Its "in use"
      stays equal to what the bikes report, with no "end without a start".
    why: >
      A stream consumer has two things to keep: its position in the stream
      and the state it built from it. The queue keeps the position: an
      event is removed only when acknowledged, so a crashed consumer gets
      the unacknowledged ones again and everything after. The snapshot
      keeps the state: before each acknowledgement the counter writes its set
      of bikes and the event it is at, so what it restores matches where it
      resumes, and an event delivered again that the snapshot already holds
      is skipped.
    real_world: >
      Running totals, sessions, fraud windows, inventory. A consumer that
      keeps state in memory alone starts from nothing after a restart and
      is wrong until the stream has replayed past everything it forgot. A
      queue gives it its position; a snapshot (or a replay log) gives it
      its state.
    docs:
      - label: "Go API: consuming persistent messages and acknowledging them"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Broker: guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: counter
    logs: counter
    trigger:
      - run: kill-counter
    reset:
      - start: counter
    expect:
      break:
        within: 15
        logs:
          - log: counter
            has: ["exited with code -9"]
      reset:
        within: 20
        logs:
          - log: counter
            has: ["restored \\d+ rides in use from the snapshot", "resumed at #\\d+", "in use: \\d+ \\(at #\\d+; the bikes say \\d+\\)"]
            lacks: ["end without a start"]

  - id: board-late
    title: The city board joins the stream late
    breaks: >
      The board starts now, taking the ride events direct.
    watch: >
      The card shows the board. The city asks which bikes are out and for
      how long, so the board lists each ride from its start event. It
      receives every event from the moment it started and none before, so
      the bikes that were already out are not on its list: "3 rides
      listed, longest B-07 for 4 s (at #812; the bikes say 21 are out: 18
      the board cannot name)". Under the diagram, the board's table shows
      the few rides it can name next to the Counter's full list. The total
      in each event tells it how many it is missing, never which bikes or
      since when. When one of those
      rides ends it sees the end and never saw the start: "end without a
      start for B-12: joined late, no history". After about half a minute
      every missed ride has ended and the line says "all of them listed",
      but the starts it missed are gone for good: it comes right only
      because every ride ends, and a bike out all day would never appear.
      The counter, next to it, stays right. Reset stops the board.
    why: >
      A direct subscriber has no position in the stream: it gets what is
      published while it is subscribed, and nothing before. State built
      from a stream is only right if it was built from the start, or from
      a snapshot taken at a known position. The board has neither. A
      total carried in the latest event can correct a count, but not a
      list: which bikes, and since when, is only in the events it missed.
    real_world: >
      A new dashboard instance, a cache warming up, a replacement service
      started mid-day. Either give it a snapshot and the position it was
      taken at, or let it replay the stream from the start (a replay log),
      or accept that it is wrong until every bike it never saw has come
      back.
    docs:
      - label: "Go API: consuming direct messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-DM-Subscribe.htm
      - label: "Broker: guaranteed messages"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Guaranteed-Messages.htm
    node: board
    logs: board
    trigger:
      - start: board
    reset:
      - stop: board
    expect:
      break:
        within: 30
        logs:
          - log: board
            has: ["\\d+ rides listed.*the bikes say \\d+ are out: \\d+ the board cannot name", "end without a start for B-\\d+: joined late, no history"]
          - log: counter
            lacks: ["end without a start"]
        holds:
          - { node: board, min: 1 }
          - { node: counter, min: 1 }
      reset:
        within: 10
        logs:
          - log: board
            has: ["stopped: \\d+ rides listed on the board, \\d+ ends without a start"]

inspect:
  - label: The stream's queue
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=10&where=queueName==q.es.*
    # spooledMsgCount is the length of the stream so far; msgSpoolUsage is
    # how far the counter is behind.
    columns: [queueName, spooledMsgCount, msgSpoolUsage, lastSpooledMsgId, highestAckedMsgId]
    ui_hint: Manager → Queues
    empty: The queue is not on the broker. Press Play, or run Apply configuration.
  - label: The counter on q.es.rides
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues/q.es.rides/txFlows?count=10
    columns: [clientName, activityState, ackedMsgCount, unackedMsgCount, redeliveredMsgCount]
    ui_hint: Manager → Queues → q.es.rides → Consumers
    empty: No consumer is bound to q.es.rides right now. Press Play, or start the counter.
