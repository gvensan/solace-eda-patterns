id: event-sourcing
# Category 1 of the pattern guide (Event Generation Patterns), fourth pattern.
order: 140
eyebrow: Event Generation Patterns
title: Event Sourcing
summary: >
  A bank's ledger stores no balances: each one is derived from the events,
  and this demo keeps them in memory. A teller sends commands; the ledger
  validates each one and records an accepted one as an event, its only
  write. Crash the ledger and it rebuilds the same balances from the
  events. Lose the events, and the balances are lost with them: the events
  are the only record.

objectives:
  - See a command validated and recorded as an event, the only thing the ledger ever writes
  - See that no balance is stored anywhere, because each one is derived from the events
  - See the balances rebuilt from the events after the ledger crashes, exactly as they were
  - "See why the event history must be durable: lose it, and every balance is lost"

pattern:
  what: >
    Record every change as an immutable event, appended and never edited,
    and derive the current state from the events. Commands are validated
    against that state; only accepted changes become events.
  when: >
    The history matters (audit, finance), or state must be rebuilt or read
    in new ways from past events.
  cost: >
    It needs a durable, complete event history, snapshots for long
    histories, persisted projections for reads, and care whenever the
    format of an event changes.
  solace: >
    Here the broker's replay log stands in for an event store: it keeps the
    events, and at start replays them for the ledger to add up. The demo
    assumes that history is complete and durable, as an event store's is;
    a replay log is bounded and meant for recovery, so production needs a
    real event store.
  related: [cqrs, event-streaming, event-carried-state-transfer]
  guide: https://solace.com/event-driven-architecture-patterns/#event-sourcing

run:
  - apply
  - build
  - ledger
  - teller

cleanup:
  - destroy

diagram:
  caption: >
    No balance is stored anywhere: each one is that account's events added
    up. The teller submits commands; the ledger validates each against the
    balances, records an accepted one as an event (its only write) and
    applies it. On start it replays the whole history and adds it up again
    before taking a command. Assumes one ledger at a time and a complete,
    durable event history; the replay log stands in for an event store.
  holdsCaption: >
    Balances are derived from events; this demo keeps them in memory, and
    stores them nowhere else. Crash the ledger and the table is gone. On
    start it adds up the events again, gets the same figures, and its note
    says how many events it took.
  duration: 2.4
  liveWhen: ledger
  nodes:
    - id: teller
      label: Teller
      sublabel: sends commands only
      kind: app
      col: 0
      action: teller
      requires:
        - label: svc-esrc-teller
          semp: /msgVpns/{vpn}/clientUsernames/svc-esrc-teller
    - id: broker
      label: Solace Broker
      sublabel: retains events, demo size
      kind: broker
      col: 1
      action: apply
      contains:
        - id: commandsq
          label: q.esrc.commands
          depth: { queue: q.esrc.commands, unit: waiting }
        - id: log
          label: "rl-esrc: event history, 1 MB demo size"
        - id: rebuildq
          label: "q.esrc.rebuild: used at start only"
      provides:
        - label: q.esrc.commands
          group: commandsq
          semp: /msgVpns/{vpn}/queues/q.esrc.commands
        - label: rl-esrc
          group: log
          semp: /msgVpns/{vpn}/replayLogs/rl-esrc
        - label: q.esrc.rebuild
          group: rebuildq
          semp: /msgVpns/{vpn}/queues/q.esrc.rebuild
        - label: cp-esrc
          semp: /msgVpns/{vpn}/clientProfiles/cp-esrc
        - label: acl-esrc
          semp: /msgVpns/{vpn}/aclProfiles/acl-esrc
    - id: ledger
      label: Ledger
      sublabel: balances derived from events
      kind: app
      shape: processor
      col: 2
      action: ledger
      holds:
        kept: memory
        count: accounts
        role: Balances are derived from events; this demo keeps them in memory. Rebuilt from the history at every start, before any command is taken.
      flowOn:
        queue: q.esrc.commands
        client: esrc-ledger
      requires:
        - label: svc-esrc-ledger
          semp: /msgVpns/{vpn}/clientUsernames/svc-esrc-ledger
  flows:
    - { id: command, from: teller, to: broker, via: commandsq, label: commands, delay: 0 }
    - { id: take, from: broker, to: ledger, via: commandsq, delay: 0.5 }
    - { id: record, from: ledger, to: broker, via: log, label: events, delay: 1.0 }
    - { id: replay, from: broker, to: broker, via: log, into: rebuildq, label: replayed at start, animate: false }
    - { id: read-back, from: broker, to: ledger, via: rebuildq, label: read at start, labelAt: 0.5, animate: false }
  paths:
    - label: A command becomes an event, and the event changes the balance
      steps:
        - flow: command
          text: "The teller submits a command, a request that can be refused: take 40.00 out of A-2. It waits in q.esrc.commands."
        - flow: take
          text: The ledger validates it against the current balance, which is what A-2's events so far add up to. Too large, and it is refused; nothing is recorded and nothing changes.
        - flow: record
          text: Accepted, it is recorded as an event, "A-2 withdrawn 40.00", in the history (rl-esrc). That is the only write; no balance is stored anywhere. Once the broker confirms it has the event, the ledger applies it, so A-2 is now its events added up, this one included. Then it takes the next command.
    - label: The ledger restarts and rebuilds before any command
      steps:
        - flow: replay
          text: On restart, the ledger rebuilds its balances by replaying the complete retained event history before processing new commands. The broker replays the history into q.esrc.rebuild, oldest first. This line carries messages only while the ledger starts.
        - flow: read-back
          at: 0.75
          text: The ledger adds every event up, from #1 to the last, and only then takes a command. Same events, same balances. If required history is missing, it cannot safely rebuild.

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates the replay log rl-esrc (1 MB, keeping only the events on
      esrc/bank/account/> and the ledger's end-of-replay markers),
      q.esrc.commands, q.esrc.rebuild, and the
      client profile, ACL profile and usernames for this scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: ledger
    label: Start the ledger
    kind: process
    cmd: [bash, ../../apps/run.sh, esrc, ledger, --client-name, esrc-ledger]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Asks the broker to replay the event history into q.esrc.rebuild and
      adds it up into balances. Then it takes the teller's commands from
      q.esrc.commands one at a time, records each accepted one as an event,
      and applies it.

  - id: teller
    label: Start the teller
    kind: process
    cmd: [bash, ../../apps/run.sh, esrc, teller, --client-name, esrc-teller]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Submits a command every second: pay an amount into an account, or
      take one out.

  - id: kill-ledger
    label: Crash the ledger
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, esrc-ledger, KILL, --wait-exit]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills the ledger outright (SIGKILL), and returns once it has gone.

  - id: trim-log
    label: Empty the event history
    kind: process
    cmd: [bash, ./trim.sh]
    cwd: .
    variant: secondary
    description: >
      Removes every event from rl-esrc, the event history. The ledger's
      next start finds nothing to rebuild from, and begins with every
      balance at 0.00.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, event-sourcing]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the replay log, the queues and the access control for this
      scenario.

failure_modes:
  - id: ledger-crash
    title: The ledger crashes
    breaks: >
      The ledger is killed. Its balances were only in its memory.
    watch:
      normally: >
        The ledger takes each command, records it as an event and applies
        it: "command 103512-7 accepted: recorded event #57, A-2 deposited
        40.00, balance 140.00". Under the diagram its four balances change
        about once a second, and q.esrc.commands shows 0 or 1 waiting.
      broke: >
        The ledger's output ends with "exited with code -9". Under the
        diagram its card says it is not running and shows no balances: they
        were only in its memory, and no balances table exists anywhere else.
        The teller carries on, and its commands pile up in q.esrc.commands:
        the waiting count climbs by one a second.
      impact: >
        No command is decided while the ledger is down, but none is lost:
        each waits in q.esrc.commands. Nothing recorded is lost either:
        every event is still in the event history, rl-esrc, and the
        balances are only what those events add up to.
      recover: >
        Reset starts the ledger with no balances. It asks for the history,
        adds it up, and logs "rebuilt from 57 events: A-1 120.00, A-2 35.00,
        ...". Under the diagram the same balances come back. Only then does
        it take commands: q.esrc.commands drains to 0. If the crash came
        after recording an event but before acknowledging its command, that
        command comes again, and is "not recorded twice".
    why: >
      In event sourcing the events are the record and the state is derived
      from them, so state that is lost can be derived again. Nothing has to
      be backed up but the events.
    real_world: >
      A service restarted after a crash or a deploy, or a new view built
      from the full history. Real event stores also keep snapshots, so a
      rebuild does not have to start from the first event ever.
    docs:
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Replaying from a replay log"
        url: https://docs.solace.com/API/API-Developer-Guide/Replay-from-Replay-Log.htm
      - label: "Message replay"
        url: https://docs.solace.com/Features/Replay/Msg-Replay-Concepts-Config.htm
    node: ledger
    logs: ledger
    trigger:
      - run: kill-ledger
    reset:
      - start: ledger
    expect:
      break:
        within: 10
        logs:
          - log: ledger
            has: ["exited with code -9"]
      reset:
        within: 20
        logs:
          - log: ledger
            has: ["asked the broker to replay the event history", "rebuilt from \\d+ events", "taking commands from q.esrc.commands"]
        holds:
          - { node: ledger, min: 4 }

  - id: history-lost
    title: The event history is lost
    breaks: >
      This breaks the demo's one assumption on purpose: that the event
      history is complete and durable. While the ledger is stopped, every
      event is removed from rl-esrc. Then the ledger starts again.
    watch:
      normally: >
        The ledger's note says "Rebuilt at start from N events": every
        balance is what the history adds up to.
      broke: >
        The trim says "OK: the replay log is empty". The ledger starts, asks
        for the history, gets nothing, and logs "rebuilt from 0 events: the
        history is empty, every account starts at 0.00". Then it takes the
        waiting commands as if the bank had just opened. Nothing warns
        anyone.
      impact: >
        Every balance in the bank is gone: the events were the only record,
        and no balances table is hiding anywhere. Worse, the ledger cannot
        tell an empty history from a lost one, so it carries on from 0.00
        and refuses withdrawals that should have gone through.
      recover: >
        Nothing brings the events back. Reset stops and starts the ledger:
        it rebuilds from the events recorded since the loss, the same
        figures it had. In production you would restore the event store
        from a replica or a backup.
    why: >
      In event sourcing the events are the one thing that must never be
      lost. A rebuild is only as good as the history it reads. A real event
      store knows how many events each stream has, so a missing history is
      an error there; a replay log on one broker is bounded and can be
      emptied with one command, which is why this demo assumes a durable,
      complete history instead of providing one.
    real_world: >
      An event store lost to a failed disk with no replica, a retention
      setting that deletes old events, or a replay log mistaken for the
      store of record. Event-sourced systems keep their events in a durable,
      replicated event store, and back it up like any database.
    docs:
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Replaying from a replay log"
        url: https://docs.solace.com/API/API-Developer-Guide/Replay-from-Replay-Log.htm
      - label: "Message replay"
        url: https://docs.solace.com/Features/Replay/Msg-Replay-Concepts-Config.htm
    node: ledger
    logs: ledger
    trigger:
      - stop: ledger
      - run: trim-log
      - start: ledger
    reset:
      - stop: ledger
      - start: ledger
    expect:
      break:
        within: 25
        logs:
          - log: trim-log
            has: ["OK: the replay log is empty"]
          - log: ledger
            has: ["rebuilt from 0 events: the history is empty", "taking commands from q.esrc.commands"]
        holds:
          - { node: ledger, min: 1 }
      reset:
        within: 25
        logs:
          - log: ledger
            has: ["rebuilt from \\d+ events", "taking commands from q.esrc.commands"]
        holds:
          - { node: ledger, min: 1 }

inspect:
  - label: Replay log
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/replayLogs
    # msgSpoolUsage is in bytes; maxSpoolUsage in MB.
    columns: [replayLogName, maxSpoolUsage, msgSpoolUsage, ingressEnabled, egressEnabled]
    ui_hint: Manager → Replay
    empty: No replay log yet. Press Play.
  - label: What the log keeps
    kind: semp
    path: /msgVpns/{vpn}/replayLogs/rl-esrc/topicFilterSubscriptions
    columns: [replayLogName, topicFilterSubscription]
    ui_hint: Manager → Replay → rl-esrc → Topic Filter Subscriptions
    empty: No replay log yet. Press Play.
  - label: Queues
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=20&where=queueName==q.esrc.*
    columns: [queueName, accessType, msgSpoolUsage]
    ui_hint: Manager → Queues
    empty: No queues yet. Press Play.
