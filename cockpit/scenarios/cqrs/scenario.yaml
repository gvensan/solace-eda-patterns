id: cqrs
# Category 1 of the pattern guide (Event Generation Patterns), second pattern.
order: 120
eyebrow: Event Generation Patterns
title: CQRS
summary: >
  Command Query Responsibility Segregation: a shop writes orders on one side
  and answers questions about them on the other. Checkout sends commands to
  the order service, which publishes an event for every order placed. The
  order summary service builds its own view from those events, an order
  count and a total per customer, and answers the account page's question
  from it: "How many orders have I placed, and how much have I spent?" The
  two sides share nothing but the events, so each can fail or slow down
  without stopping the other.

objectives:
  - See the same orders kept twice, in two shapes, by two services
  - See a command handled on the write side and the read side catch up from its event
  - See reads answered while the write side is down, and commands kept until it is back
  - See the read side fall behind, and what the account page is told
  - Learn why the read side is always a little behind the writes

pattern:
  what: >
    Separate the model that handles commands (writes) from the model that
    answers queries (reads). In event-driven systems the read model is
    usually its own store, kept up to date from the write side's events.
  when: >
    Reads and writes have different shapes or loads: many lookups, few
    checked writes, or several views of the same data.
  cost: >
    The read side is always somewhat behind the writes, and the product has
    to decide what users see in between. Two models are more to build and
    run than one: use it where reads and writes really differ.
  solace: >
    Commands on a queue for the write side, events on topics with a queue
    per read side, and queries by request-reply.
  related: [event-sourcing, event-carried-state-transfer, request-reply]
  guide: https://solace.com/event-driven-architecture-patterns/#cqrs

run:
  - apply
  - build
  - summary
  - orders
  - account
  - checkout

cleanup:
  - destroy
  - forget-database

diagram:
  caption: >
    A shop. Checkout sends "place order" commands into q.cqrs.commands. The
    order service (the write side) takes each one, saves the order in its
    own database and publishes "order placed". q.cqrs.view keeps those
    events for the order summary service (the read side), which builds its
    own view from them: an order count and a total per customer. The
    account page asks "How many orders have I placed, and how much have I
    spent?" of the order summary, never the order service. Questions and answers are direct request-reply messages:
    they never wait on a queue.
  holdsCaption: >
    The same orders, kept twice in two shapes. The order service keeps each
    order as it was placed. The order summary keeps one line per customer,
    built only from the "order placed" events, in the shape the account
    page asks for. The account page is answered from the second table and
    never touches the first. That is CQRS. Without it, one model would do
    both, and every question would add up a customer's orders on the
    tables checkout writes to. Compare the notes under the two tables: the
    Order Summary is normally built from as many orders as the Order
    Service holds, up to the same latest order, or one behind.
  duration: 2.6
  liveWhen: checkout
  nodes:
    - id: checkout
      label: Checkout
      sublabel: a command a second
      kind: app
      col: 0
      action: checkout
      requires:
        - label: svc-cqrs-checkout
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-checkout
    - id: account
      label: Account Page
      sublabel: asks every 2 s
      kind: app
      col: 0
      action: account
      requires:
        - label: svc-cqrs-account
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-account
    - id: broker
      label: Solace Broker
      sublabel: commands, events, queries
      kind: broker
      col: 1
      action: apply
      contains:
        - id: commands
          label: q.cqrs.commands
          depth: { queue: q.cqrs.commands, unit: waiting }
        - id: events
          label: q.cqrs.view
          depth: { queue: q.cqrs.view, unit: waiting }
      provides:
        - label: q.cqrs.commands
          group: commands
          semp: /msgVpns/{vpn}/queues/q.cqrs.commands
        - label: q.cqrs.view
          group: events
          semp: /msgVpns/{vpn}/queues/q.cqrs.view
        - label: cp-cqrs
          semp: /msgVpns/{vpn}/clientProfiles/cp-cqrs
        - label: acl-cqrs
          semp: /msgVpns/{vpn}/aclProfiles/acl-cqrs
    - id: orders
      label: Order Service
      sublabel: write side
      kind: app
      shape: processor
      col: 2
      action: orders
      holds:
        kept: disk
        role: The write side. Saves every order it places, as it was placed.
      flowOn:
        queue: q.cqrs.commands
        client: cqrs-orders
      requires:
        - label: svc-cqrs-write
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-write
    - id: summary
      label: Order Summary
      sublabel: read side, its own view
      kind: app
      shape: processor
      col: 2
      action: summary
      holds:
        kept: memory
        count: customers
        role: The read side. One line per customer, built from the events. Never reads the order service's database.
      flowOn:
        queue: q.cqrs.view
        client: cqrs-summary
      requires:
        - label: svc-cqrs-view
          semp: /msgVpns/{vpn}/clientUsernames/svc-cqrs-view
  flows:
    - { id: place-order, from: checkout, to: broker, via: commands, label: place order, delay: 0 }
    - { id: to-orders, from: broker, to: orders, via: commands, delay: 0.5 }
    - { id: order-placed, from: orders, to: broker, via: events, label: order placed, delay: 1.0 }
    - { id: to-summary, from: broker, to: summary, via: events, source: orders, delay: 1.5 }
    - { id: query, from: account, to: broker, label: query, delay: 0.2 }
    - { id: query-in, from: broker, to: summary, label: query, source: account, delay: 0.5 }
    - { id: answer, from: summary, to: broker, label: answer, source: account, delay: 0.8 }
    - { id: answer-back, from: broker, to: account, label: answer, source: summary, delay: 1.3 }
  paths:
    - label: A command becomes an order, and the view catches up
      steps:
        - flow: place-order
          text: Checkout sends a place-order command. The broker keeps it on q.cqrs.commands.
        - flow: to-orders
          text: The order service (the write side) takes it, numbers the order and saves it in its database.
        - flow: order-placed
          text: It publishes "order placed". q.cqrs.view keeps the event for the read side.
        - flow: to-summary
          text: The order summary applies the event to its view, a moment after the write.
    - label: The account page asks, the read side answers
      steps:
        - flow: query
          text: "The account page asks about a customer: a direct message, kept on no queue."
        - flow: query-in
          text: The broker delivers the question to the order summary. Nothing goes to the order service.
        - flow: answer
          text: The order summary answers from its own view, and says which order the view is built up to.
        - flow: answer-back
          text: The broker returns the answer to the account page.

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates q.cqrs.commands and q.cqrs.view, and the client profile, ACL
      profile and usernames for this scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: summary
    label: Start the order summary service
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, view, --client-name, cqrs-summary]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The read side. Applies each "order placed" event from q.cqrs.view to
      its own view, an order count and total per customer, and answers
      questions from that view.

  - id: orders
    label: Start the order service
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, write, --client-name, cqrs-orders]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      The write side. Takes each command from q.cqrs.commands, gives the
      order the next number, saves it in its own database (a file, so a
      restart carries on from the last number), publishes "order placed",
      then acknowledges the command.

  - id: account
    label: Start the account page
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, account, --client-name, cqrs-account]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Asks the order summary service about a customer every 2 seconds, and
      prints the answer with the order the view was built up to.

  - id: checkout
    label: Start checkout
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, checkout, --client-name, cqrs-checkout]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Sends a "place order" command a second and waits for the broker to
      store it.

  - id: slow-summary
    label: Slow the order summary service down
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, cqrs-summary, USR1]
    cwd: .
    variant: secondary
    description: >
      The order summary service takes 2 seconds to apply each event, slower
      than orders arrive. It keeps answering questions at full speed.

  - id: normal-summary
    label: Put the order summary service back to normal speed
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, cqrs-summary, USR2]
    cwd: .
    variant: secondary
    description: >
      The order summary service applies events at full speed again.

  - id: kill-orders
    label: Crash the order service
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, cqrs-orders, KILL, --wait-exit]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills the order service outright (SIGKILL), and returns once it has
      gone.

  - id: forget-database
    label: Delete the order database
    kind: process
    cmd: [bash, ../../apps/run.sh, cqrs, write, --forget]
    cwd: .
    variant: danger
    description: >
      Deletes the order service's database, so the next Play starts from
      order #1.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, cqrs]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the queues and access control for this scenario.

failure_modes:
  - id: read-side-behind
    title: The read side falls behind
    breaks: >
      The order summary service slows down to one event every 2 seconds,
      while checkout places one a second.
    watch:
      normally: >
        The order summary applies each order a few milliseconds after it is
        placed, and the account page's answers say "applied 0.0 s after it
        was placed". Under the
        diagram, the Order Service's latest order and the order the Order
        Summary is built up to are the same, or one apart.
      broke: >
        The order summary output says "slowed down: 2s to apply each
        event", then applies one order every 2 seconds. The account page is
        still answered at once, but from an older view: "view as of order
        #40, applied 9.0 s after it was placed", and the delay grows. That
        figure is about the last order applied. How far behind the view is
        now is the gap between the two latest order numbers under the
        diagram.
      impact: >
        Under the diagram, the Order Summary falls further behind the Order
        Service's latest order, and q.cqrs.view fills with events not yet
        applied. Checkout and the order service carry on at full speed: the
        write side never waits for the read side. The hidden risk: a
        customer is shown a summary without their latest orders, and only
        "view as of order #" says so.
      recover: >
        Press Reset. The order summary says "back to normal speed", applies
        the waiting events within a second or two, and the account page is
        back to "applied 0.0 s after it was placed". Nothing was lost: the events waited on
        q.cqrs.view.
    why: >
      The read side builds its view from events, after the write side has
      published them. It is always behind; normally by milliseconds. When it
      is slow, its queue holds the events it has not applied, and its
      answers describe the past. Nothing on the write side notices, which
      is the point of separating them, and also why the read side has to say
      which order its answer is built up to.
    real_world: >
      A search index or reporting view rebuilt from events while a big
      import runs. Users see "your order is not in your summary yet". CQRS
      systems show the view's age, read their own writes from the write
      side, or wait for the view to reach a given order number.
    docs:
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Go API: request-reply messaging"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-API-Request-Reply.htm
    node: summary
    logs: account
    trigger:
      - run: slow-summary
    reset:
      - run: normal-summary
    expect:
      break:
        within: 25
        logs:
          - log: summary
            has: ["slowed down: 2s to apply each event"]
          - log: account
            has: ["view as of order #\\d+, applied ([5-9]|\\d\\d+)\\.\\d s after it was placed"]
        holds:
          - { node: summary, min: 1 }
      reset:
        within: 30
        logs:
          - log: summary
            has: ["back to normal speed"]
          - log: account
            has: ["view as of order #\\d+, applied 0\\.\\d s after it was placed"]

  - id: write-side-down
    title: The write side goes down
    breaks: >
      The order service is killed. Checkout keeps sending commands and the
      account page keeps asking.
    watch:
      normally: >
        The order service takes each command, saves the order and publishes
        "order placed". Its latest order, under the diagram, climbs by one a
        second.
      broke: >
        Checkout's output carries on: every command is still "accepted by
        the broker". Each one is an order submitted, not an order placed:
        it has no order number yet. q.cqrs.commands fills up, and
        under the diagram the Order Service's card says it is not running
        and its orders stay on disk.
      impact: >
        No new orders are placed, but nothing is refused: the submitted
        ones wait on q.cqrs.commands. Reads carry on. The account page is
        still answered from the order summary's view, which has stopped
        changing ("view as of order #" stays the same). Reads continue
        from the last event the view applied, while new submissions wait.
        (An order saved just before the crash may have no event yet: the
        order service publishes it when it is back.) The hidden risk: checkout only knows the
        command was accepted, not that the order was placed. What to tell
        the customer in between is a product decision.
      recover: >
        Press Reset. The order service opens its database ("opened its order
        database"), carries on from the last order number, and places every
        waiting command in turn. The view catches up. Nothing was lost: a
        command is acknowledged only after its order is saved and its event
        published.
    why: >
      The write side and the read side are separate services joined only by
      events. With the write side down, reads carry on from the read side's
      own view, and commands wait on their queue instead of failing. Nothing
      is lost; it is late.
    real_world: >
      A deploy or a database failover on the write side. Users can still
      browse and see their order summary; new orders are submitted, and
      placed when the write side returns. Whether checkout should tell the
      user "order submitted" or wait for "order placed" is a product
      decision CQRS makes you take.
    docs:
      - label: "Go API: publishing guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Publish.htm
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
    node: orders
    logs: checkout
    trigger:
      - run: kill-orders
    reset:
      - start: orders
    expect:
      break:
        within: 15
        logs:
          - log: checkout
            has: ["command \\d+-\\d+: place an order for C-\\d+ .*accepted by the broker"]
          - log: account
            has: ["C-\\d+: \\d+ orders?, "]
      reset:
        within: 20
        logs:
          - log: orders
            has: ["opened its order database: \\d+ orders", "order #\\d+ placed for C-\\d+, event published"]
          - log: summary
            has: ["order #\\d+ applied"]

inspect:
  - label: Queues
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=20&where=queueName==q.cqrs.*
    columns: [queueName, msgSpoolUsage, spooledMsgCount]
    ui_hint: Manager → Queues
    empty: No queue yet. Press Play.
  - label: Connected clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=20&where=clientName==cqrs-*
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
    empty: No app of this scenario is connected. Press Play.
