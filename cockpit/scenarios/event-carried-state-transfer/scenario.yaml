id: event-carried-state-transfer
# Category 1 of the pattern guide (Event Generation Patterns), first pattern.
order: 110
eyebrow: Event Generation Patterns
title: Event-Carried State Transfer
summary: >
  A shop. The customer service publishes the whole customer record every
  time a customer changes. Shipping keeps its own copy from those events and
  never has to ask anyone where to send a parcel. (This shop ships to the
  customer's latest known address. Where the address is fixed at checkout,
  it belongs on the order.) Invoicing keeps no copy:
  for every order it asks the customer service. The cards show what each
  choice costs.

objectives:
  - See shipping answer from its own copy, with no call to the customer service
  - See invoicing stop when the customer service stops, and shipping carry on
  - See a service that has lost its copy, and one way to give it back
  - Learn what an event must carry for consumers to keep their own state

pattern:
  what: >
    Events carry the state that changed, not just the fact that something
    changed, so consumers can keep their own copy and never have to ask the
    owner.
  when: >
    Many services need the same reference data (customers, products,
    prices), and calling the owner for every event would tie their uptime to
    it.
  cost: >
    Every consumer keeps and stores a copy, the copy is a little behind the
    owner, and a new or restarted consumer needs a way to get the current
    state.
  solace: >
    Ordinary guaranteed events on a topic per entity. A queue per consumer
    keeps the changes in order and holds them while the consumer is away.
  related: [cqrs, change-data-capture, event-sourcing]
  guide: https://solace.com/event-driven-architecture-patterns/#ecst

run:
  - apply
  - build
  - shipping
  - invoicing
  - customers
  - orders

cleanup:
  - destroy
  - forget-database

diagram:
  caption: >
    The customer service publishes every changed customer record, whole, and
    answers lookups. Orders carry only the customer's id. Every order goes
    into both queues; customer records go into q.ecst.shipping only, because
    only that queue subscribes to them. Shipping reads both from its queue
    and keeps a copy of every customer. Invoicing gets orders only, and asks
    the customer service about each one.
    Lookups and their replies are direct messages: they never wait on a
    queue.
  duration: 2.4
  liveWhen: orders
  holdsCaption: >
    Every customer event carries the whole customer record, so shipping can
    build its own copy of the customer database from the events alone.
    Compare the Customer Service and Shipping tables: they match, and
    shipping never asked the customer service for anything. That is
    event-carried state transfer.
    Invoicing shows the alternative: orders carry only the customer's id,
    so it keeps nothing and asks for every order.
  nodes:
    - id: orders
      label: Order Service
      sublabel: customer id only
      kind: app
      col: 0
      action: orders
      requires:
        - label: svc-ecst-orders
          semp: /msgVpns/{vpn}/clientUsernames/svc-ecst-orders
    - id: broker
      label: Solace Broker
      sublabel: two queues
      kind: broker
      col: 1
      action: apply
      contains:
        - id: shipq
          label: q.ecst.shipping
          depth: { queue: q.ecst.shipping, unit: waiting }
        - id: invq
          label: q.ecst.invoicing
          depth: { queue: q.ecst.invoicing, unit: waiting }
      provides:
        - label: q.ecst.shipping
          group: shipq
          semp: /msgVpns/{vpn}/queues/q.ecst.shipping
        - label: q.ecst.invoicing
          group: invq
          semp: /msgVpns/{vpn}/queues/q.ecst.invoicing
        - label: cp-ecst
          semp: /msgVpns/{vpn}/clientProfiles/cp-ecst
        - label: acl-ecst
          semp: /msgVpns/{vpn}/aclProfiles/acl-ecst
    - id: invoicing
      label: Invoicing
      sublabel: asks per order
      kind: app
      shape: processor
      col: 2
      action: invoicing
      holds:
        kept: memory
        counters: true
        role: Keeps nothing. Asks the customer service for every order.
      flowOn:
        queue: q.ecst.invoicing
        client: ecst-invoicing
      requires:
        - label: svc-ecst-invoicing
          semp: /msgVpns/{vpn}/clientUsernames/svc-ecst-invoicing
    - id: customers
      label: Customer Service
      sublabel: whole records, lookups
      kind: app
      shape: processor
      col: 2
      action: customers
      holds:
        kept: disk
        count: customers
        role: The owner. Every change starts here.
      requires:
        - label: svc-ecst-crm
          semp: /msgVpns/{vpn}/clientUsernames/svc-ecst-crm
    - id: shipping
      label: Shipping
      sublabel: keeps a copy
      kind: app
      col: 2
      action: shipping
      holds:
        kept: memory
        count: customers
        copyOf: customers
        role: A copy, built from the whole records the customer events carry. Never asks.
      flowOn:
        queue: q.ecst.shipping
        client: ecst-shipping
      requires:
        - label: svc-ecst-shipping
          semp: /msgVpns/{vpn}/clientUsernames/svc-ecst-shipping
  flows:
    # Orders go into both queues, customer records into shipping's only:
    # each line ends at the queue whose subscription takes it.
    - { id: orders-ship, from: orders, to: broker, via: shipq, label: orders, delay: 0 }
    - { id: orders-inv, from: orders, to: broker, via: invq, delay: 0 }
    - { id: records, from: customers, to: broker, via: shipq, label: whole customer records, delay: 0.3 }
    - { id: to-shipping, from: broker, to: shipping, via: shipq, label: orders + records, labelAt: 0.45, delay: 0.8 }
    - { id: to-invoicing, from: broker, to: invoicing, via: invq, label: orders only, delay: 0.8 }
    - { id: lookup, from: invoicing, to: broker, label: lookup, delay: 1.4 }
    - { id: lookup-in, from: broker, to: customers, label: lookup, source: invoicing, delay: 1.9 }
  paths:
    - label: A customer changes, and the whole record travels
      steps:
        - flow: records
          text: The customer service publishes the whole customer record. Only q.ecst.shipping subscribes to it.
        - flow: to-shipping
          text: Shipping reads records and orders from its one queue, in the order the broker received them, and updates its copy.
    - label: An order is placed, carrying only the customer's id
      steps:
        - flow: orders-ship
          text: "The order goes into q.ecst.shipping. Shipping reads it with the records (line 2) and ships from its own copy."
        - flow: orders-inv
          text: The same order goes into q.ecst.invoicing too, because that queue subscribes to orders as well.
        - flow: to-invoicing
          text: Invoicing takes the order. It has no copy of the customer, so it has to ask.
    - label: Invoicing asks the customer service
      steps:
        - flow: lookup
          text: "Invoicing sends a lookup for the customer: a direct message, kept on no queue."
        - flow: lookup-in
          text: The broker delivers it to the customer service, which answers straight back to invoicing. If it is down, nobody answers.

actions:
  - id: apply
    label: Apply configuration
    kind: terraform
    command: apply
    tf_dir: tf
    variant: primary
    description: >
      Creates q.ecst.shipping (orders and customer records) and
      q.ecst.invoicing (orders), and the client profile, ACL profile and
      usernames for this scenario.

  - id: build
    label: Build the apps
    kind: process
    cmd: [bash, ../../apps/run.sh, build]
    cwd: .
    variant: secondary
    description: >
      Compiles the Go apps shared by every scenario. Only needed to rebuild
      after a change.

  - id: shipping
    label: Start shipping
    kind: process
    cmd: [bash, ../../apps/run.sh, ecst, shipping, --client-name, ecst-shipping]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Reads q.ecst.shipping. Keeps a copy of every customer from the
      customer records, in memory, and ships each order to the city in its
      copy.

  - id: invoicing
    label: Start invoicing
    kind: process
    cmd: [bash, ../../apps/run.sh, ecst, invoicing, --client-name, ecst-invoicing]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Reads q.ecst.invoicing. For each order, asks the customer service for
      the customer's name and city and waits up to 2 seconds. Without an answer it
      asks again, and takes no other order meanwhile.

  - id: customers
    label: Start the customer service
    kind: process
    cmd: [bash, ../../apps/run.sh, ecst, customers, --client-name, ecst-customers]
    cwd: .
    long_running: true
    variant: secondary
    description: >
      Keeps its customers in its own database (a file), so a restart carries
      on where it stopped. Publishes every customer record once, then moves a
      customer to a new city every 15 seconds and publishes the whole record
      again. Answers lookups.

  - id: orders
    label: Start the order service
    kind: process
    cmd: [bash, ../../apps/run.sh, ecst, orders, --client-name, ecst-orders]
    cwd: .
    long_running: true
    variant: primary
    description: >
      Places an order a second for a random customer. The event carries the
      customer's id and nothing else about them.

  - id: kill-customers
    label: Crash the customer service
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, ecst-customers, KILL, --wait-exit]
    cwd: .
    variant: secondary
    failure_only: true
    description: >
      Kills the customer service outright (SIGKILL), and returns once it has
      gone.

  - id: resend
    label: Ask the customer service to publish every record again
    kind: process
    cmd: [bash, ../../scripts/signal_app.sh, ecst-customers, USR1]
    cwd: .
    variant: secondary
    description: >
      The customer service publishes every customer record again, to every
      queue that subscribes to them. A consumer that lost its copy gets it
      back.

  - id: forget-database
    label: Delete the customer database
    kind: process
    cmd: [bash, ../../apps/run.sh, ecst, customers, --forget]
    cwd: .
    variant: danger
    description: >
      Deletes the customer service's database, so the next Play starts with
      every customer at version 1.

  - id: reconcile
    label: Reconcile with broker
    kind: process
    cmd: [bash, ../../scripts/reconcile.sh, event-carried-state-transfer]
    cwd: .
    variant: secondary
    description: >
      Use this if Play fails with "already exists". It imports objects that are
      on the broker but missing from terraform state. The broker is not modified.

  - id: destroy
    label: Remove configuration
    kind: terraform
    command: destroy
    tf_dir: tf
    variant: danger
    description: >
      Deletes the queues and access control for this scenario.

failure_modes:
  - id: customers-down
    title: The customer service goes down
    breaks: >
      The customer service is killed. Orders keep coming.
    watch:
      normally: >
        Invoicing asks the customer service about every order and bills it a
        few milliseconds later. Shipping ships every order from its own copy
        and asks nobody.
      broke: >
        Nobody answers invoicing's lookups. In the invoicing output, each
        lookup fails after 2 seconds with the API's timeout error, then "not
        billed yet, asking again" for the same order.
      impact: >
        No invoices go out. Invoicing's failed count under the diagram
        climbs, and unbilled orders pile up on q.ecst.invoicing. Shipping is
        not affected: it keeps shipping from its own copy ("ships to Lyon
        (from my copy)" in its log), and its copy under the diagram stays at
        8 customers.
      recover: >
        Press Reset. The customer service starts again from its database,
        invoicing's next lookup is answered, and it bills the orders that
        waited. None were lost: invoicing acknowledges an order only once it
        is billed, so they stayed on the queue.
    why: >
      Invoicing depends on the customer service being up at the moment of
      every order: a thin event plus a call back couples the two services'
      availability. Shipping copied the state from earlier events, so it
      depends on the customer service only for changes, and a change it has
      not seen yet just leaves its copy a little out of date.
    real_world: >
      A shipping, pricing or fraud service that calls a central customer or
      product service for every event. When that service is slow or down,
      every caller is too. Copying the state from events removes the call,
      at the cost of keeping a copy and of the copy being slightly behind.
    docs:
      - label: "Go API: request-reply messaging"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-API-Request-Reply.htm
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
    node: customers
    logs: invoicing
    trigger:
      - run: kill-customers
    reset:
      - start: customers
    expect:
      break:
        within: 15
        logs:
          - log: invoicing
            has: ["lookup of C-\\d+ failed: .*(?i:time ?out|timed out)", "not billed yet, asking again"]
          - log: shipping
            has: ["ships to \\w+ \\(from my copy"]
        holds:
          - { node: shipping, missing: { max: 0 } }
      reset:
        within: 20
        logs:
          - log: invoicing
            has: ["billed to .* \\(asked the customer service"]
          - log: customers
            has: ["opened its customer database: 8 customers"]

  - id: shipping-loses-copy
    title: Shipping restarts and has lost its copy
    breaks: >
      Shipping is restarted. Its copy of the customers was in memory, so it
      starts with none.
    watch:
      normally: >
        Shipping ships every order from its own copy of the 8 customers,
        built from customer events, and asks nobody.
      broke: >
        Shipping restarted, and its copy was in memory, so the copy is gone.
        In the shipping output, "starting with no copy of any customer", then
        "no copy of C-05 yet, parcel held" for each order it cannot place.
        Under the diagram its copy drops to 0 customers and lists the parcels
        it holds.
      impact: >
        Those parcels do not ship. The queue cannot help: shipping
        acknowledged the customer events that built its copy, so the broker
        deleted them. A customer comes back only when its record next
        changes: here about every two minutes per customer, in production
        perhaps months. The held parcels are only in shipping's memory too,
        so another restart now would lose them without a word.
      recover: >
        Press Reset. The customer service publishes every customer record
        again, shipping's copy refills to "Matches Customer Service: 8 of 8",
        and the held parcels ship at once ("copy arrived, ships to").
    why: >
      With event-carried state transfer the copy is the consumer's to keep.
      The events it consumed are gone from its queue once acknowledged, so a
      consumer that loses its copy cannot rebuild it from the queue. It needs
      the copy stored durably, or a way to get the current state again: here
      the owner publishes every record again on request.
    real_world: >
      A new service that starts consuming customer events today knows only
      the customers that change from today. Teams handle this with a bulk
      load at start, a "republish everything" request, a compacted or
      replayable log, or by storing the copy in a database.
    docs:
      - label: "Go API: consuming guaranteed messages"
        url: https://docs.solace.com/API/API-Developer-Guide-Go/Go-PM-Subscribe.htm
      - label: "Queues"
        url: https://docs.solace.com/Messaging/Guaranteed-Msg/Endpoints.htm
    node: shipping
    logs: shipping
    trigger:
      - stop: shipping
      - start: shipping
    reset:
      - start: shipping
      - run: resend
    expect:
      break:
        within: 15
        logs:
          - log: shipping
            has: ["starting with no copy of any customer", "no copy of C-\\d+ yet, parcel held"]
        holds:
          - { node: shipping, max: 2, missing: { min: 6 } }
      reset:
        within: 15
        logs:
          - log: customers
            has: ["published all 8 customer records \\(asked to send everything again\\)"]
          - log: shipping
            has: ["copy arrived, ships to"]
        holds:
          - { node: shipping, min: 8, matched: { min: 8 } }

inspect:
  - label: Queues
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/queues?count=20&where=queueName==q.ecst.*
    columns: [queueName, msgSpoolUsage, spooledMsgCount]
    ui_hint: Manager → Queues
    empty: No queue yet. Press Play.
  - label: Connected clients
    kind: semp
    api: monitor
    path: /msgVpns/{vpn}/clients?count=20&where=clientName==ecst-*
    # dataRxMsgCount is what the broker received from the client: invoicing's
    # rises with every lookup, shipping's stays at 0.
    columns: [clientName, clientUsername, dataRxMsgCount, dataTxMsgCount]
    ui_hint: Manager → Clients
    empty: No app of this scenario is connected. Press Play.
